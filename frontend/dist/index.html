<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexCorp — Company Important Date & Task Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    </noscript>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured Global Error:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding: 24px; font-family: sans-serif; background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; border-radius: 8px; margin: 24px; max-width: 700px;">' +
            '<h2 style="margin-top:0; font-size: 18px; font-weight: bold;">Application Startup Error</h2>' +
            '<p style="font-size: 14px; margin-bottom: 8px;">' + (e.message || 'Unknown Error') + '</p>' +
            (e.filename ? '<p style="font-size: 12px; color: #be123c;">Source: ' + e.filename + ':' + e.lineno + '</p>' : '') +
            (e.error && e.error.stack ? '<pre style="background: #ffffff; padding: 12px; border-radius: 4px; overflow: auto; font-size: 11px; max-height: 200px;">' + e.error.stack + '</pre>' : '') +
            '<button onclick="localStorage.clear(); window.location.reload();" style="margin-top: 12px; padding: 8px 16px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Clear Cache & Reload</button>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Promise Rejection:', e.reason);
      });
    </script>
    <script type="module" crossorigin src="/assets/index-DvVTaTy3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CXlKYgy5.css">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
  </body>
</html>
